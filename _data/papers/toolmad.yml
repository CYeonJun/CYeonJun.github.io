abstract: >-
  Large Language Models (LLMs) often suffer from hallucinations and factual inaccuracies, particularly in complex reasoning
  and fact verification tasks. Multi-Agent Debate (MAD) systems aim to improve answer accuracy by enabling multiple LLM
  agents to engage in dialogue, promoting diverse reasoning and mutual verification. However, existing MAD frameworks
  primarily rely on internal knowledge or static documents, making them vulnerable to hallucinations. While multi-agent
  debate with knowledge-enhanced framework (MADKE) introduces external evidence to mitigate this issue, its one-time
  retrieval mechanism limits adaptability to new arguments or emerging information during the debate. To address these
  limitations, we propose Tool-MAD, a multi-agent debate framework that enhances factual verification by assigning each
  agent a distinct external tool, such as a search API or a RAG module. Tool-MAD introduces three key innovations: (1) a
  multi-agent debate framework in which agents leverage heterogeneous external tools to encourage diverse perspectives, (2)
  an adaptive query formulation mechanism that iteratively refines evidence retrieval as the debate progresses, and (3) the
  integration of Faithfulness and Answer Relevance scores into the final decision process, enabling the Judge agent to
  quantitatively evaluate response grounding and question alignment. Experimental results on four fact verification
  benchmarks show that Tool-MAD consistently outperforms MAD and achieves stronger or comparable performance than MADKE,
  with performance improvements of up to 11.2 percentage points over MAD and 8.0 percentage points over MADKE.
  Furthermore, experiments in medically specialized domains demonstrate that Tool-MAD maintains stable performance across
  different tool configurations and domain conditions, suggesting strong potential for broader real-world fact-checking
  applications.
