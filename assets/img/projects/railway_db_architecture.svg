<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Pretendard, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- data generator -->
  <rect x="20" y="20" width="200" height="66" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="120" y="47" text-anchor="middle" font-size="14" fill="#374151" font-weight="700">Synthetic data generator</text>
  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#6b7280">44 tables · up to 293M rows</text>
  <line x1="120" y1="86" x2="120" y2="128" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- row -->
  <rect x="20" y="130" width="200" height="80" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="120" y="163" text-anchor="middle" font-size="15" fill="#111827" font-weight="700">Train-control messages</text>
  <text x="120" y="184" text-anchor="middle" font-size="12" fill="#6b7280">simulated, up to 1,000 TPS</text>

  <rect x="260" y="130" width="150" height="80" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="335" y="163" text-anchor="middle" font-size="15" fill="#111827" font-weight="700">Kafka</text>
  <text x="335" y="184" text-anchor="middle" font-size="12" fill="#6b7280">Redpanda · 73 topics</text>

  <rect x="450" y="130" width="160" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="530" y="163" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">Processing workers</text>
  <text x="530" y="184" text-anchor="middle" font-size="12" fill="#1e40af">batched writes</text>

  <rect x="650" y="130" width="130" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="715" y="163" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">TiDB</text>
  <text x="715" y="184" text-anchor="middle" font-size="12" fill="#1e40af">system of record</text>

  <rect x="810" y="130" width="130" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="875" y="163" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">ClickHouse</text>
  <text x="875" y="184" text-anchor="middle" font-size="12" fill="#1e40af">analytics</text>

  <line x1="220" y1="170" x2="256" y2="170" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="410" y1="170" x2="446" y2="170" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="170" x2="646" y2="170" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="780" y1="170" x2="806" y2="170" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- downstream -->
  <line x1="875" y1="210" x2="875" y2="258" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="740" y="260" width="200" height="66" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="840" y="288" text-anchor="middle" font-size="14" fill="#111827" font-weight="700">Parquet files → AI server</text>
  <text x="840" y="308" text-anchor="middle" font-size="12" fill="#6b7280">monitoring and model input</text>

  <!-- checks -->
  <rect x="260" y="260" width="440" height="66" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.6"/>
  <text x="480" y="288" text-anchor="middle" font-size="14" fill="#78350f" font-weight="700">Checked end to end</text>
  <text x="480" y="308" text-anchor="middle" font-size="12" fill="#92400e">query latency · Kafka lag · row counts and checksums · failure recovery</text>
</svg>
