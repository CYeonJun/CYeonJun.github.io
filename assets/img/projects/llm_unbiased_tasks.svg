<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- legend -->
  <rect x="200" y="16" width="14" height="14" rx="3" fill="#b5452f"/>
  <text x="220" y="28" font-size="13" fill="#374151">Real-world (현실반영형)</text>
  <rect x="400" y="16" width="14" height="14" rx="3" fill="#1f6fbf"/>
  <text x="420" y="28" font-size="13" fill="#374151">Ideal-world (규범교정형)</text>

  <!-- axis: score 1..7 mapped to x 200..620 (70 px per point) -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="200" y1="48" x2="200" y2="296"/>
    <line x1="340" y1="48" x2="340" y2="296"/>
    <line x1="480" y1="48" x2="480" y2="296"/>
    <line x1="620" y1="48" x2="620" y2="296"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="200" y="314">1</text>
    <text x="340" y="314">3</text>
    <text x="480" y="314">5</text>
    <text x="620" y="314">7</text>
  </g>

  <!-- T1 -->
  <text x="188" y="72" font-size="13" fill="#111827" font-weight="700" text-anchor="end">T1 Tutoring slots</text>
  <text x="188" y="89" font-size="11" fill="#6b7280" text-anchor="end">opportunity</text>
  <rect x="200" y="58" width="299.6" height="14" rx="2" fill="#b5452f"/>
  <text x="505" y="70" font-size="12" fill="#b5452f">5.28</text>
  <rect x="200" y="76" width="319.2" height="14" rx="2" fill="#1f6fbf"/>
  <text x="525" y="88" font-size="12" fill="#1f6fbf" font-weight="700">5.56</text>
  <text x="748" y="80" font-size="12" fill="#1f6fbf" font-weight="700" text-anchor="end">Ideal +0.28</text>

  <!-- T2 -->
  <text x="188" y="134" font-size="13" fill="#111827" font-weight="700" text-anchor="end">T2 Dropout alerts</text>
  <text x="188" y="151" font-size="11" fill="#6b7280" text-anchor="end">stigma risk</text>
  <rect x="200" y="120" width="275.8" height="14" rx="2" fill="#b5452f"/>
  <text x="481" y="132" font-size="12" fill="#b5452f">4.94</text>
  <rect x="200" y="138" width="338.1" height="14" rx="2" fill="#1f6fbf"/>
  <text x="544" y="150" font-size="12" fill="#1f6fbf" font-weight="700">5.83</text>
  <text x="748" y="142" font-size="12" fill="#1f6fbf" font-weight="700" text-anchor="end">Ideal +0.89</text>

  <!-- T3 -->
  <text x="188" y="196" font-size="13" fill="#111827" font-weight="700" text-anchor="end">T3 Interview recruiting</text>
  <text x="188" y="213" font-size="11" fill="#6b7280" text-anchor="end">resource limits</text>
  <rect x="200" y="182" width="338.1" height="14" rx="2" fill="#b5452f"/>
  <text x="544" y="194" font-size="12" fill="#b5452f" font-weight="700">5.83</text>
  <rect x="200" y="200" width="268.1" height="14" rx="2" fill="#1f6fbf"/>
  <text x="474" y="212" font-size="12" fill="#1f6fbf">4.83</text>
  <text x="748" y="204" font-size="12" fill="#b5452f" font-weight="700" text-anchor="end">Real +1.00</text>

  <!-- T4 -->
  <text x="188" y="258" font-size="13" fill="#111827" font-weight="700" text-anchor="end">T4 Onboarding</text>
  <text x="188" y="275" font-size="11" fill="#6b7280" text-anchor="end">mixed</text>
  <rect x="200" y="244" width="291.9" height="14" rx="2" fill="#b5452f"/>
  <text x="498" y="256" font-size="12" fill="#b5452f">5.17</text>
  <rect x="200" y="262" width="291.9" height="14" rx="2" fill="#1f6fbf"/>
  <text x="498" y="274" font-size="12" fill="#1f6fbf">5.17</text>
  <text x="748" y="266" font-size="12" fill="#6b7280" font-weight="700" text-anchor="end">Tie</text>
