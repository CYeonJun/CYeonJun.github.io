<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Pretendard, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- retrieval corpus -->
  <rect x="210" y="20" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="310" y="44" text-anchor="middle" font-size="14" fill="#374151" font-weight="600">403 KR–US claim pairs</text>
  <text x="310" y="63" text-anchor="middle" font-size="12" fill="#6b7280">(the claim itself excluded)</text>
  <line x1="310" y1="76" x2="310" y2="118" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- main row -->
  <rect x="20" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="95" y="155" text-anchor="middle" font-size="15" fill="#111827" font-weight="700">Korean claim</text>
  <text x="95" y="176" text-anchor="middle" font-size="12" fill="#6b7280">input</text>

  <rect x="210" y="120" width="200" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="310" y="152" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">Retrieve 5 similar pairs</text>
  <text x="310" y="174" text-anchor="middle" font-size="12" fill="#1e40af">dense search · Milvus · bge-m3</text>

  <rect x="450" y="120" width="200" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="550" y="152" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">Structured prompt</text>
  <text x="550" y="174" text-anchor="middle" font-size="12" fill="#1e40af">US drafting rules + examples</text>

  <rect x="690" y="120" width="250" height="80" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="815" y="152" text-anchor="middle" font-size="15" fill="#111827" font-weight="700">US-style English claim</text>
  <text x="815" y="174" text-anchor="middle" font-size="12" fill="#6b7280">LLM: GPT-4o-mini / Gemini 2.5 Flash</text>

  <line x1="170" y1="160" x2="206" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="410" y1="160" x2="446" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="650" y1="160" x2="686" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- evaluation -->
  <line x1="815" y1="200" x2="815" y2="248" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="560" y="250" width="380" height="70" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.6"/>
  <text x="750" y="278" text-anchor="middle" font-size="15" fill="#78350f" font-weight="700">Evaluate against the filed US claim</text>
  <text x="750" y="300" text-anchor="middle" font-size="12" fill="#92400e">SacreBLEU (wording) + PatClaimEval (patent claim quality)</text>
</svg>
